[package]
name = "koyomi-service"
description = "Run as a Windows service that logs on as a person's own account, and install, start, stop and query it: service logon right, DACL for that account, delayed auto start; on Linux `state` asks systemd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target."cfg(windows)".dependencies]
ito-power = { git = "https://github.com/uchmk/ito", rev = "d2e252b84ffafd3298060a239c42a53cb028988e" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Services",
] }
