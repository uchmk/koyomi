[package]
name = "koyomi"
description = "Small job scheduler and monitor (a light JP1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `koyomi-com` (src/bin) is the console front for Windows, shipped as
# `koyomi.com`; plain `cargo run` still means the window.
default-run = "koyomi"

# The checklist generator and the bug form's writer; their own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[[example]]
name = "make-bugform"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }

[features]
# Test builds only: the clock, the tray and the notifications take their
# input from files (UCHMK_FAKE_CLOCK, ITO_TRAY_STATE/KEYS, ITO_NOTIFY_SINK). Never shipped.
test-hooks = ["ito-common/fake-clock", "ito-tray/test-hook", "ito-notify/test-sink"]

[dependencies]
# Every ito crate at the same rev. scripts/ito-first.py says which crates an
# app must have and which it must not replace; what ito lacks, ask ito for.
ito-common = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["clock", "egui"] }
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["edit"] }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# Which wgpu backends to draw with: GL first on Windows.
ito-gpu = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The settings screen: language / clock / theme pages, keys_page, notify_page, update_card.
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# `--keys "<script>"`: the real window driven without a person.
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# `?` / F1: the key help.
ito-help = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-secret = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# `koyomi service`: the engine as a Windows service under the person's own account (TODO 86).
koyomi-service = { path = "../koyomi-service" }
# The calendar's holiday table download (the Cabinet Office's syukujitsu.csv over https, from the window).
ito-fetch = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# `[http]`: the loopback listener that starts nets and reads runs (POST /runs, GET /runs/<id>).
koyomi-http = { path = "../koyomi-http", features = ["tls"] }
# `[[when]] mail`: read-only IMAP look at new mail (TODO 84); a `kind = "mail"`
# job's message, attachments and all (`koyomi mail run`, TODO 107).
koyomi-mail = { path = "../koyomi-mail" }
# `send` and `fetch` over SFTP (`koyomi sftp run`), and `koyomi sftp hostkey`.
koyomi-sftp = { path = "../koyomi-sftp" }
# `send` and `fetch` to and from S3 (`koyomi cloud run`).
koyomi-cloud = { path = "../koyomi-cloud" }
# The delete, empty and copy chores (`koyomi file run`): no shell.
ito-fileops = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The picker for 参照… when the window is on another PC's engine; the engine lists its own disk (`list_local`).
ito-filepick = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["egui", "serde", "local"] }
# `kind = "winrm"` (`koyomi winrm run`), and `koyomi winrm cert`.
koyomi-winrm = { path = "../koyomi-winrm" }
# `kind = "sql"` (`koyomi sql run`): a script on SQL Server, PostgreSQL or SQLite.
koyomi-sql = { path = "../koyomi-sql" }
# System notification, sound, webhook.
ito-notify = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The system log line a monitoring tool watches (Event Viewer / syslog).
ito-eventlog = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# Follows a log file for `[[when]] log = …`.
ito-tail = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# F12: an issue form filled with the version, OS and what the app knows.
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The window's own title bar (drag, caption buttons, the palette box, the bell).
ito-titlebar = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# Pages out as a PDF or to the printer.
ito-export = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# Tables as CSV or Excel (--csv, the window's export).
koyomi-table = { path = "../koyomi-table" }
# The bottom status bar: the app's items, the clock at the right end.
ito-statusbar = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The list the bell opens.
ito-notices = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# Ctrl+Shift+P. Optional: drop it when the app has no commands to list.
ito-palette = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# `koyomi.com` and the answers `out` and `err` write.
ito-console = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The engine's door (`koyomi engine` answers the window and the CLI), the folder watcher, the confirm box,
# the state marks (symbol + word, not colour alone), child processes, and the bundled mono font.
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-watch = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-confirm = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-diff = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The first-run guide: an empty tree says what to do first.
ito-guide = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["egui"] }
# Plain wording and hover text for the technical words (`easy = true` in common.toml).
ito-glossary = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["egui"] }
ito-match = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The find bar of the log viewer (find only, no replace).
ito-find ={ git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-a11y = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["egui"] }
ito-openin = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The path buttons: "copy path" goes through the one clipboard writer.
ito-clipboard = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# The holiday table's file chooser: the OS open dialog, off the UI thread.
ito-dialog = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-fonts = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef", features = ["egui"] }
# `koyomi mcp`: Claude Code reads the runs and (after the person agrees) starts and stops them.
ito-mcp = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-power = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-tray = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
ito-proc = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
koyomi-core = { path = "../koyomi-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# eframe's own defaults, but for `winit/default`: that draws the title on
# Wayland's window frame with ab_glyph, which brings the unmaintained ttf-parser.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = "0.36"

[dev-dependencies]
# TESTING.md -> the lanes' check tables (examples/make-testcheck.rs).
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "9bd898e28b2177fe9c43ad7529f23495170233ef" }
# A fake S3 on 127.0.0.1 for the tests of `koyomi cloud run` (cloud.rs).
koyomi-cloud = { path = "../koyomi-cloud", features = ["test-util"] }
