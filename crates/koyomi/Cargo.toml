[package]
name = "koyomi"
description = "Small job scheduler and monitor (a light JP1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `koyomi-com` (src/bin) is the console front for Windows, shipped as
# `koyomi.com`; plain `cargo run` still means the window.
default-run = "koyomi"

# The checklist generator and the bug form's writer; their own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[[example]]
name = "make-bugform"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }

[dependencies]
# Every ito crate at the same rev. scripts/ito-first.py says which crates an
# app must have and which it must not replace; what ito lacks, ask ito for.
ito-common = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["clock", "egui"] }
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["edit"] }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# The settings screen: language / clock / theme pages, keys_page, notify_page, update_card.
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# `--keys "<script>"`: the real window driven without a person.
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# `?` / F1: the key help.
ito-help = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-secret = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# System notification, sound, webhook.
ito-notify = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# F12: an issue form filled with the version, OS and what the app knows.
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# The window's own title bar (drag, caption buttons, the palette box, the bell).
ito-titlebar = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# Pages out as a PDF or to the printer.
ito-export = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# The bottom status bar: the app's items, the clock at the right end.
ito-statusbar = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# The list the bell opens.
ito-notices = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# Ctrl+Shift+P. Optional: drop it when the app has no commands to list.
ito-palette = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# `koyomi.com` and the answers `out` and `err` write.
ito-console = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# The engine's door (`koyomi engine` answers the window and the CLI), the folder watcher, the confirm box,
# the state marks (symbol + word, not colour alone), child processes, and the bundled mono font.
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-watch = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-confirm = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-diff = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
# The first-run guide: an empty tree says what to do first.
ito-guide = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["egui"] }
# Plain wording and hover text for the technical words (`easy = true` in common.toml).
ito-glossary = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["egui"] }
ito-match = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-a11y = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["egui"] }
ito-fonts = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18", features = ["egui"] }
# `koyomi mcp`: Claude Code reads the runs and (after the person agrees) starts and stops them.
ito-mcp = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
ito-proc = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
koyomi-core = { path = "../koyomi-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# eframe's own defaults, but for `winit/default`: that draws the title on
# Wayland's window frame with ab_glyph, which brings the unmaintained ttf-parser.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = "0.36"

[dev-dependencies]
# TESTING.md -> the lanes' check tables (examples/make-testcheck.rs).
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
