<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock">
<title>koyomi</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <span class="brand">koyomi</span>
  <span id="engine" class="chip" hidden></span>
  <span id="ha" class="chip" hidden></span>
  <span class="grow"></span>
  <span id="who" class="dim"></span>
  <button id="signout" type="button" class="quiet" hidden>サインアウト</button>
</header>

<section id="signin" class="signin" hidden>
  <h1>サインイン</h1>
  <p class="dim">koyomi.toml の <code>[http]</code> か <code>[[http.user]]</code> のトークンを入れてください。トークンはこのページに残りません（サインインのあとはクッキーで続きます）。</p>
  <form id="signin-form">
    <input id="token" type="password" autocomplete="off" placeholder="トークン" aria-label="トークン" required>
    <button type="submit" class="primary">サインイン</button>
  </form>
  <p id="signin-message" class="message bad" role="status"></p>
</section>

<div id="app" class="app" hidden>
  <nav id="tree" class="tree" aria-label="ジョブネット一覧">
    <div class="tree-head">ジョブネット一覧</div>
    <p id="todo" class="todo" hidden></p>
    <div id="groups"></div>
  </nav>

  <main class="center">
    <p id="paused" class="band" hidden>スケジュール停止中: 時刻が来ても実行されません</p>
    <div class="tabs" role="tablist">
      <button id="tab-today" type="button" role="tab" aria-selected="true">今日</button>
      <button id="tab-history" type="button" role="tab" aria-selected="false">履歴</button>
      <span class="grow"></span>
      <input id="day" type="date" aria-label="日付" hidden>
      <span id="date" class="date mono"></span>
    </div>
    <div id="counts" class="counts"></div>
    <p id="message" class="message" role="status"></p>
    <div class="table-wrap">
      <table class="runs">
        <thead>
          <tr><th>状態</th><th>ジョブネット</th><th id="col-planned">予定</th><th>開始</th><th>終了</th><th>時間</th><th id="col-next">次の実行</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty dim" hidden></p>
    </div>
  </main>

  <aside id="pane" class="pane" hidden>
    <div class="pane-head">
      <h2 id="pane-title"></h2>
      <button id="pane-close" type="button" class="quiet" aria-label="閉じる">✕</button>
    </div>
    <p id="pane-state" class="state-line"></p>
    <p id="pane-sub" class="sub mono"></p>
    <p id="pane-note" class="note" hidden></p>
    <div id="pane-actions" class="actions"></div>
    <div id="pane-body"></div>
  </aside>
</div>

<footer class="statusbar">
  <span id="foot"></span>
</footer>

<dialog id="ask">
  <form method="dialog">
    <p id="ask-text"></p>
    <div id="ask-fields" class="fields"></div>
    <div class="actions end">
      <button id="ask-no" type="submit" value="no" autofocus>キャンセル</button>
      <button id="ask-yes" type="submit" value="yes" class="primary">はい</button>
    </div>
  </form>
</dialog>
</body>
</html>
