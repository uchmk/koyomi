[package]
name = "koyomi-core"
description = "koyomi's job-net definitions: the TOML model, its checks and the approved-definition store (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
sha2 = "0.10"
ito-match = { git = "https://github.com/uchmk/ito", rev = "37afb7fff4c5907b1d6657a186f30682557471f9" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
roxmltree = "0.20"
