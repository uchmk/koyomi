[package]
name = "koyomi-core"
description = "koyomi's job-net definitions: the TOML model, its checks and the approved-definition store (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
sha2 = "0.11"
ito-common = { git = "https://github.com/uchmk/ito", rev = "78ba28d0e250ec8fefdc2f3f6871e967815daa2e", features = ["clock"] }
ito-match = { git = "https://github.com/uchmk/ito", rev = "78ba28d0e250ec8fefdc2f3f6871e967815daa2e" }
ito-proc = { git = "https://github.com/uchmk/ito", rev = "78ba28d0e250ec8fefdc2f3f6871e967815daa2e" }
ito-zip = { git = "https://github.com/uchmk/ito", rev = "78ba28d0e250ec8fefdc2f3f6871e967815daa2e" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
roxmltree = "0.21"
