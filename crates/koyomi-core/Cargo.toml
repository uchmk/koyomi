[package]
name = "koyomi-core"
description = "koyomi's job-net definitions: the TOML model, its checks and the approved-definition store (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
sha2 = "0.10"
ito-match = { git = "https://github.com/uchmk/ito", rev = "447ce10c56bdae8195bb2c6f97c5f19b2ca4508c" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
