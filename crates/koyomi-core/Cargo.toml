[package]
name = "koyomi-core"
description = "koyomi's job-net definitions: the TOML model, its checks and the approved-definition store (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
sha2 = "0.10"
ito-match = { git = "https://github.com/uchmk/ito", rev = "15fa4c31caa882ef6b8a0599ebb77bf4cf1f9c18" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
