[package]
name = "koyomi-core"
description = "koyomi's job-net definitions: the TOML model, its checks and the approved-definition store (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
sha2 = "0.10"
ito-common = { git = "https://github.com/uchmk/ito", rev = "72286fc9daddd801808122329001eebbb813723e", features = ["clock"] }
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "72286fc9daddd801808122329001eebbb813723e" }
ito-match = { git = "https://github.com/uchmk/ito", rev = "72286fc9daddd801808122329001eebbb813723e" }
ito-proc = { git = "https://github.com/uchmk/ito", rev = "72286fc9daddd801808122329001eebbb813723e" }
ito-zip = { git = "https://github.com/uchmk/ito", rev = "72286fc9daddd801808122329001eebbb813723e" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
roxmltree = "0.20"
