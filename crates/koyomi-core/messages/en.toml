cause = "An error occurred while renaming the file."
action = "Check that the file is not open elsewhere and that you have the permission."

[E3292]
when = "A notification webhook address cannot be saved to the credential store"
text = "The notification webhook address cannot be saved to the credential store. ({0})"
cause = "The credential store may be unreachable, or it refused the write."
action = "Check the state of the credential store and save again."

[E3293]
