text = "The {0} address has no user. ({2})"
cause = "A postgres:// address needs a user."
action = "Give it in the form {1}."

[E3589]
when = "rows of a sql cannot be read as counts of rows"
text = "The value {0} of rows cannot be used."
cause = "rows cannot be read as the counts of rows that are normal."
action = "Give the counts of rows that are normal, as in 0, 1.. or 1..100. Several can be separated by commas."

[E3590]
when = "command of an ssh or a winrm is empty"
text = "command is not given."
cause = "command is not given, or holds only spaces."
action = "Give the command to run on the peer PC in command."

[E3591]
when = "cert of a winrm is not in the form of a fingerprint"
text = "The cert {0} cannot be used."
cause = "cert is not in the form AB:CD:… (32 bytes of SHA-256 in hex)."
action = "Give the AB:CD:… value that koyomi winrm cert <host> prints in cert."

[E3592]
when = "The port in an address cannot be used"
text = "The port {0} of the address {1} cannot be used."
cause = "The port is not a number from 1 to 65535."
action = "Give a number from 1 to 65535 as the port."

[E3593]
when = "An address has no host"
text = "The {0} address {1} has no host."
cause = "The host is empty, or the user before @ is empty."
action = "Give it in the form [user@]host[:port]."

[E3594]
when = "The user or the host in an address has a character that cannot be used"
text = "The user or the host of the address {0} has a character that cannot be used."
cause = "The user or the host holds a space, a quote, ; & | < > or the like, or the host starts with -."
action = "Remove the characters that cannot be used from the user and the host."

[E3595]
when = "The path in an address has a line break"
text = "The path of the address {0} cannot have a line break."
cause = "The path holds a line break."
action = "Remove the line break from the path."

[E3596]
when = "host_key is not given for an sftp:// or ssh:// peer"
text = "host_key is not given for {0}."
cause = "A {0} connection needs the fingerprint of the peer's host key."
action = "Give the fingerprint of the peer's host key (SHA256:…) in host_key. koyomi sftp hostkey <host> shows it."

[E3597]
when = "host_key is not in the form of a fingerprint"
text = "The host_key {0} cannot be used."
cause = "host_key is not SHA256: followed by a base64 digest."
action = "Give the SHA256:… value that koyomi sftp hostkey <host> prints in host_key."

[E3598]
when = "Both key and password are given"
text = "key and password cannot be given together."
cause = "Both key and password are given."
action = "Give one of key and password."

