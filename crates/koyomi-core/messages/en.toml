when = "The request of POST /door holds a password_value and cannot be read as a request"
text = "Cannot read request as a request to the engine. (Its content is not shown because it holds a password.)"
cause = "The content of request does not match the form of a request the engine accepts. The reason is not shown so that the password is not repeated."
action = "Specify the JSON of a request the engine accepts in request."

[E3779]
when = "GET /runs has to but no from"
text = "to is specified, but from is not."
cause = "to is a key that goes with from."
action = "Specify the first day in from, as YYYY-MM-DD."

[E3780]
when = "POST /runs/<id>/rerun has both from and next"
text = "from and next cannot be specified together."
cause = "Both of them say which job the rerun starts from."
action = "Specify only one of them."

[E3781]
when = "POST /runs/<id>/rerun has warn but no next"
text = "warn has to be specified together with next."
cause = "warn makes the job named in next end as a warning."
action = "When you specify warn, specify a job in next."

[E3782]
when = "A request to the HTTP API gives a value that is not the form of a run ID"
text = "{0} is not the form of a run ID."
cause = "A run ID is built from the date and time the run started."
action = "Specify the run ID as YYYYMMDD-HHMMSS-NN."

[E3783]
when = "Handing back is requested on a PC without [standby]"
text = "[standby] is not specified in koyomi.toml."
cause = "This PC is not set up as a standby."
action = "Specify [standby] in koyomi.toml of the standby PC."

[E3784]
when = "Handing back is requested on a standby that has not taken over"
text = "The schedules cannot be handed back because they have not been taken over from {0}."
cause = "This PC is standing by and has not taken over from {0} yet."
action = "Run it again after this PC has taken over from {0}."

[E3785]
when = "Handing back is requested before the standby has checked its connection"
text = "The schedules cannot be handed back because the state of {0} is not known yet."
cause = "The first poll of the connection has not finished since the engine started."
action = "Wait a little, then run it again."

[E3786]
when = "A standby with give_back = \"manual\" is asked to hand back"
text = "The schedules cannot be handed back because give_back = \"manual\"."
cause = "With give_back = \"manual\", the standby does not hand back until koyomi standby giveback is run."
action = "Run koyomi standby giveback on the standby PC."

[E3787]
when = "A standby with give_back = \"auto\" is asked to hand back before the connection has answered enough times"
text = "The schedules cannot be handed back because {0} has answered {1} times in a row. ({2} are needed)"
cause = "With give_back = \"auto\", the standby does not hand back until the connection has answered misses times in a row."
action = "Wait until the connection keeps answering, then run it again."

[E3788]
when = "The definitions a standby copied from the connection cannot be written to this PC"
text = "Cannot write the copied definitions to this PC. ({0})"
cause = "Saving a definition was refused. The reason is in the parentheses."
action = "Check the reason in the parentheses. The copy is tried again every 5 minutes."

[E3789]
when = "The connection's koyomi is too old for a standby to copy definitions"
text = "Cannot copy the definitions because the koyomi of {0} is too old."
cause = "The answer of /nets from the connection has no hash (sha256) of the files."
action = "Update the koyomi of the connection."

[E3790]
when = "The runs going on at the connection cannot be read"
text = "Cannot read the runs going on at {0}. ({1})"
cause = "The versions of koyomi on the connection and on this PC may differ, so the form of a run does not match."
action = "Update koyomi on the connection and on this PC to the same version."

[W3791]
when = "A standby takes over, and the last runs it read from the connection are too old"
text = "The runs last read from {0} are too old, so they are not used for the takeover."
cause = "More than 30 seconds have passed since they were read, and some of them may have ended since."
action = "Check the runs after the takeover, and run them again if necessary."

[E1078]
when = "The settings of a [[host]] cannot be used"
text = "The settings of [[host]] {0} are not valid. ({1})"
cause = "One of on, host_key, key, password, cert and auth is not valid, or they do not fit together."
action = "Check on (ssh://[user@]host[:port] or winrm://user@host[:port]) and the keys that fit that kind of host."

[E1079]
when = "A [[host]] has a key that its kind of host cannot take"
text = "{1} of [[host]] {0} cannot be given to a {2} host."
cause = "host_key and key are for an ssh host, cert and auth for a winrm host."
action = "Remove {1}."

[E1080]
when = "The settings of a [[bucket]] cannot be used"
text = "The settings of [[bucket]] {0} are not valid. ({1})"
cause = "One of url, key_id, password, region and endpoint is not valid, or they do not fit together."
action = "Check url (s3://bucket/folder/), key_id, password, and region or endpoint."

[E1081]
when = "The settings of a [[mailbox]] cannot be used"
text = "The settings of [[mailbox]] {0} are not valid. ({1})"
cause = "mail or password is not valid."
action = "Give mail the mailbox to watch and password as secret:<name>."

[E1082]
when = "A key of a [[host]], [[bucket]] or [[mailbox]] contains { or }"
text = "{2} of {0} {1} cannot contain { or }."
cause = "{0} is not a template, so {param:...} and {var:...} cannot be used."
action = "Give the value itself in {2}, without {param:...} or {var:...}."

[E3399]
when = "A job or a trigger that names a registered place also gives a key the registration owns"
text = "{0} cannot be given when {1} gives a name."
cause = "A {1} with a name uses [[{2}]] of koyomi.toml, which owns {0}."
action = "Remove {0}, or write the whole setting instead of the name of {1}."

[E3400]
when = "A send or fetch gives both host and bucket"
text = "Give either host or bucket, not both."
cause = "host names a [[host]] (SFTP) of koyomi.toml and bucket names a [[bucket]] (S3); they cannot be used together."
action = "Remove one of them."

[E3485]
when = "The far side of a send or fetch with host or bucket is written as an address with scheme://"
text = "With {1}, give a path in {0}, not an address."
cause = "The registration of koyomi.toml holds where to connect, so the job only gives the path in it."
action = "Change {0} to a path without sftp:// or s3://."

[E3486]
when = "The path of a send or fetch with bucket starts with /"
text = "The path {0} of a bucket cannot start with /."
cause = "The path is joined after the url of the [[bucket]], so a path that starts with / does not say whether it means the top of the bucket."
action = "Give the path without the leading /."

[E3487]
when = "An address has a password written in it"
text = "The address {0} has a password written in it."
cause = "A password is written after the user name (user:password@host). An address is shown on the screen, in logs and in exported files, so koyomi does not take a password there."
action = "Write the address without the password ([user@]host) and give the password as secret:<name> in the password field."

[E3296]
when = "The host of a send, fetch, ssh or winrm job names a host that is not in [[host]] of koyomi.toml"
text = "The job cannot start because the host {0} is not in [[host]] of koyomi.toml."
cause = "[[host]] of koyomi.toml has no entry with this name. It may have been removed, or the name may be wrong."
action = "Register {0} in [[host]], or change the host or on of the job."

[E3297]
when = "The bucket of a send or fetch names a bucket that is not in [[bucket]] of koyomi.toml"
text = "The job cannot start because the bucket {0} is not in [[bucket]] of koyomi.toml."
cause = "[[bucket]] of koyomi.toml has no entry with this name. It may have been removed, or the name may be wrong."
action = "Register {0} in [[bucket]], or change the bucket of the job."

[E3298]
when = "A job names a [[host]] that does not fit its kind"
text = "The host {0} is a {2} host, so a {1} job cannot use it."
cause = "send, fetch and ssh use an ssh host, and winrm uses a winrm host."
action = "Name a [[host]] that fits the kind of the job."

[E3299]
when = "A registered place and the path of a job cannot be joined"
text = "{0} and the path {1} cannot be joined. ({2})"
cause = "The address that results is not valid."
action = "Check the reason in the parentheses, and fix the path of the job or the url of the registration."

[W3792]
when = "A job of a jobnet names a [[host]] that is not in koyomi.toml"
text = "Job {1} of jobnet {0} names {2} as its host, but it is not in [[host]] of koyomi.toml."
cause = "[[host]] of koyomi.toml has no entry with this name."
action = "Register {2} in [[host]], or change the host or on of the job."

[W3793]
when = "A send or fetch of a jobnet names a [[bucket]] that is not in koyomi.toml"
text = "Job {1} of jobnet {0} gives {2} as bucket, but it is not in [[bucket]] of koyomi.toml."
cause = "[[bucket]] of koyomi.toml has no entry with this name."
action = "Register {2} in [[bucket]], or change the bucket of the job."

[W3794]
when = "A job of a jobnet names a [[host]] that does not fit its kind"
text = "The host {2} that job {1} of jobnet {0} names is a {3} host, so this job cannot use it."
cause = "send, fetch and ssh use an ssh host, and winrm uses a winrm host."
action = "Name a [[host]] that fits the kind of the job."

[W3795]
when = "A [[when]] of a jobnet names a [[mailbox]] that is not in koyomi.toml"
text = "A [[when]] of jobnet {0} gives {1} as mailbox, but it is not in [[mailbox]] of koyomi.toml."
cause = "[[mailbox]] of koyomi.toml has no entry with this name."
action = "Register {1} in [[mailbox]], or change the mailbox of the [[when]]."

