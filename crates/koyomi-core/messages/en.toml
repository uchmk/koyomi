cause = "[[account]] of koyomi.toml has no entry with this name. It may have been removed, or the name may be wrong."
action = "Register {0} in [[account]], or change the run_as of the job."

[E3295]
when = "The database of a sql job names a database that is not in [[database]] of koyomi.toml"
