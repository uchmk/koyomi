when = "calendar が必要な指定があり、calendar が指定されていないとき"
text = "ジョブネットが business_day、shift、または on_closed を使用していますが、calendar が指定されていません。"
cause = "営業日の判断には、カレンダーが必要なためです。"
action = "ジョブネットまたは _group.toml に、calendar を指定してください。"

[E3376]
when = "use で指定した子ジョブネットが存在しないとき"
text = "子ジョブネット {0} が存在しません。"
cause = "use に指定したジョブネットの定義が、見つからないためです。"
action = "use には、存在するジョブネットを <グループ>/<名前> の形式で指定してください。"

[E3377]
when = "use で指定した子ジョブネットの定義に誤りがあるとき"
text = "子ジョブネット {0} の定義に誤りがあります。"
cause = "子ジョブネットが、定義の誤りのために使用できないためです。"
action = "子ジョブネットの定義を修正してください。"

[E3378]
when = "after_jobnet で指定した先行のジョブネットが存在しないとき"
text = "先行のジョブネット {0} が存在しません。"
cause = "after_jobnet に指定したジョブネットの定義が、見つからないためです。"
action = "after_jobnet には、存在するジョブネットを指定してください。"

[E3379]
when = "after_jobnet の指定が輪になっているとき"
text = "after_jobnet の指定が輪になっています。（{0}）"
cause = "ジョブネットが、自分自身を先行のジョブネットとしてたどれるためです。"
action = "輪になっている after_jobnet のいずれかを削除してください。"

[E3380]
when = "ジョブネットの定義が UTF-8 でないとき"
text = "{0} を UTF-8 の文字として読み込めません。"
cause = "ファイルが、UTF-8 で保存されていないためです。"
action = "ファイルを UTF-8 で保存し直してください。"

[E3381]
when = "[[blackout]] の from または to を読み込めないとき"
text = "[[blackout]] の {0} {1} を日付または日時として読み込めません。"
cause = "値が、日付または日時の形式になっていないためです。"
action = "{0} には、\"2026-12-29\" または \"2026-12-29 22:00\" の形式で指定してください。"

[E3382]
when = "[[blackout]] の to が from より前のとき"
text = "[[blackout]] の to（{0}）が、from（{1}）より前になっています。"
cause = "計画停止の終わりが、始まりより前であるためです。"
action = "to には、from より後の日付または日時を指定してください。"

[E3383]
when = "静かな時間帯を読み込めないとき"
text = "時間帯 {0} を読み込めません。"
cause = "時間帯が、開始時刻と終了時刻を - で区切った形式になっていないためです。"
action = "\"12:00-13:00\" のように、開始時刻と終了時刻を - で区切って指定してください。"

[E3384]
when = "静かな時間帯の開始と終了が同じとき"
text = "時間帯 {0} の開始と終了が同じです。"
cause = "開始時刻と終了時刻が同じでは、時間帯にならないためです。"
action = "開始と終了には、異なる時刻を指定してください。"

[E3385]
when = "期限を読み込めないとき"
text = "期限 {0} を読み込めません。"
cause = "期限が、時刻でも長さでもないためです。"
action = "\"06:00\"（時刻）または \"30m\"（長さ）の形式で指定してください。"

[E3386]
when = "待機系の PC で --only を指定したとき"
text = "この PC は待機系のため、--only を使用できません。"
cause = "待機系が引き継ぐ前は、実行の記録が主系の PC にあり、日ごとの実行状況を判断できないためです。"
action = "実行の記録がある {0} で実行してください。"

[E3387]
when = "時刻を読み込めないとき"
text = "時刻 {0} を読み込めません。"
cause = "時刻が、HH:MM または HH:MM:SS の形式になっていないためです。"
action = "\"02:00\" のように、時刻を指定してください。"

[E3388]
when = "曜日を読み込めないとき"
text = "曜日 \"{0}\" を読み込めません。"
cause = "曜日が、mon から sun までのいずれでもないためです。"
action = "mon、tue、wed、thu、fri、sat、sun のいずれかを指定してください。"

[E3389]
when = "日付を読み込めないとき"
text = "日付 {0} を読み込めません。"
cause = "日付が、年-月-日 の形式になっていないためです。"
action = "2026-11-30 のように、年-月-日 の形式で指定してください。"

[E3390]
when = "日時を読み込めないとき"
text = "日時 {0} を読み込めません。"
cause = "日時が、年-月-日T時:分:秒 の形式になっていない、または時差が付いているためです。"
action = "2026-11-30T21:00:00 のように、時差を付けずに指定してください。"

[E3391]
when = "月-日の指定を読み込めないとき"
text = "日付 {0} を月-日として読み込めません。"
cause = "日付が、月-日 の形式になっていない、または存在しない日であるためです。"
action = "\"04-01\" のように、月-日 の形式で指定してください。"

[E3392]
when = "mail の指定が imaps://ユーザー@サーバー/フォルダー の形式でないとき"
text = "mail に指定された {0} が正しくありません。"
cause = "mail が、imaps:// で始まるユーザー、サーバー、フォルダーの形式になっていないためです。"
action = "imaps://me@example.com@imap.example.com/INBOX のように、\"imaps://ユーザー@サーバー/フォルダー\" の形式で指定してください。"

[E3393]
when = "mail に imap:// が指定されているとき"
text = "mail に、暗号化されない imap:// が指定されています。"
cause = "mail は、TLS で暗号化された imaps:// だけを受け付けるためです。"
action = "imaps:// で始まるアドレスを指定してください。"

[E3394]
when = "mail のポートが範囲外のとき"
text = "mail のポート {0} が範囲外です。"
cause = "ポートが、1 から 65535 までの数でないためです。"
action = "ポートには 1 から 65535 までの数を指定してください。"

[E3470]
when = "時間が 0 のとき"
text = "時間 {0} は 0 です。"
cause = "時間には、0 より長い値が必要なためです。"
action = "30m のように、0 より長い時間を指定してください。"

[E3471]
when = "時間を読み込めないとき"
text = "時間 {0} を読み込めません。"
cause = "時間が、h、m、s の順に 1 回ずつ並んだ、数値と単位の組み合わせになっていないためです。"
action = "30m、1h30m、90s のように、数値と単位を指定してください。"

[E3472]
when = "営業日で日付を移動する指定があり、calendar が指定されていないとき"
text = "{0} は営業日で日付を移動しますが、calendar が指定されていません。"
cause = "bd での移動には、営業日を判断するカレンダーが必要なためです。"
action = "ジョブネットまたは _group.toml に、calendar を指定してください。"

[E3473]
when = "移動した先の日付を求められないとき"
text = "{0} で、{1} から移動した先の日付を求められません。"
cause = "移動した結果が、扱える日付の範囲を超えている、または営業日が見つからないためです。"
action = "移動する数と単位を確認してください。"

[E3474]
when = "{var:} に名前が指定されていないとき"
text = "{var:} に名前が指定されていません。"
cause = "{var:…} には、[vars] の名前が必要なためです。"
action = "koyomi.toml の [vars] の名前を、{var:share} のように指定してください。"

[E3475]
when = "{var:…} の名前に使用できない文字が含まれるとき"
text = "{var:…} の名前 {0} は使用できません。"
cause = "[vars] の名前には、英数字と _ だけを使用できるためです。"
action = "英数字と _ だけの名前を指定してください。"

[E3476]
when = "{param:…} の値が [params] にないとき"
text = "{param:{0}} の値が、[params] にありません。"
cause = "{param:…} に指定した名前が、ジョブネットの [params] に定義されていないためです。"
action = "[params] に {0} を追加するか、{param:…} の名前を修正してください。"

[E3477]
when = "{var:…} の値が [vars] にないとき"
text = "{var:{0}} の値が、koyomi.toml の [vars] にありません。"
cause = "{var:…} に指定した名前が、koyomi.toml の [vars] に定義されていないためです。"
action = "koyomi.toml の [vars] に {0} を追加するか、{var:…} の名前を修正してください。"

[E3478]
when = "[params] のないジョブネットに値が渡されたとき"
text = "値 {0} を渡せません。このジョブネットには [params] がありません。"
cause = "渡された値の名前が、ジョブネットの [params] に定義されていないためです。"
action = "ジョブネットに [params] を定義するか、値の指定を取り消してください。"

[E3479]
when = "[params] にない名前の値が渡されたとき"
text = "値 {0} は、[params] にありません。（定義されているのは {1}）"
cause = "渡された値の名前が、ジョブネットの [params] に定義されていないためです。"
action = "[params] にある名前を指定してください。"

[E3480]
when = "日付の置き換えに、移動する数がないとき"
text = "{0} の、移動する数が指定されていません。"
cause = "+ または - の後に、数が続いていないためです。"
action = "{date-1d} のように、+ または - の後に数と単位を指定してください。"

[E3481]
when = "日付の置き換えに、単位がないとき"
text = "{0} に、単位が指定されていません。"
cause = "{date…} の移動には、単位が必要なためです。"
action = "単位には、d、bd、m、y のいずれかを指定してください。"

[E3482]
when = "日付の置き換えの単位を読み込めないとき"
text = "{0} の単位 {1} を読み込めません。"
cause = "使用できない単位が、指定されているためです。"
action = "{month} には数のみ、または m を、{date} には d、bd、m、y を指定してください。"

[E3483]
when = "日付の置き換えの書式を読み込めないとき"
text = "{0} の書式 {1} を読み込めません。"
cause = "日付の書式が、空であるか、正しくないためです。"
action = "{date:%Y%m%d} のように、日付の書式を指定してください。"

[E3484]
when = "ジョブの項目の置き換えに失敗したとき"
text = "ジョブ {0} の {1} を展開できません。（{2}）"
cause = "{param:…}、{var:…}、{date…} などの置き換えに失敗したためです。"
action = "（）内の理由を確認して、{param:…}、{var:…}、{date…} の指定を修正してください。"

[E3770]
when = "エンジンの状態ファイルが UTF-8 でないとき"
text = "{0} を UTF-8 の文字として読み込めません。"
cause = "ファイルが、UTF-8 で保存されていないためです。"
action = "ファイルを UTF-8 で保存し直してください。"

[E3771]
when = "保存するファイルの名前が UTF-8 でないとき"
text = "{0} の名前が UTF-8 ではないため、zip に追加できません。"
cause = "zip には、UTF-8 でない名前のファイルを、そのままでは格納できないためです。"
action = "ファイルの名前を、UTF-8 で表せる名前に変更してください。"

[E3772]
when = "実行の ID を読み込めないとき"
text = "{0} を実行の ID として読み込めません。"
cause = "実行の ID が、決められた形式になっていないためです。"
action = "実行の ID を確認してください。"

