action = "対処"

[E2101]
when = "接続先のエンジンに接続できないとき"
text = "接続先 {0} に接続できません。（{1}）"
cause = "接続先のエンジンが停止している、HTTP を受け付ける設定になっていない、またはファイアウォールで通信が遮断されている可能性があります。"
action = "接続先のエンジンが起動していること、[http] の lan = true、ファイアウォールの設定を確認してください。"

[E2102]
when = "要求が届いたかどうかを確認できないとき"
text = "要求が接続先に届いたかどうかを確認できません。（{0}）"
cause = "要求の送信後に通信が切断された、または応答の内容を確認できなかったため、接続先で処理された可能性があります。"
action = "履歴を確認し、必要な場合は再度実行してください。"

[E2103]
when = "接続先の証明書が登録された fingerprint と一致しないとき"
text = "接続先 {0} の証明書が登録された fingerprint と一致しません。（接続先が示した値: {1}）"
cause = "接続先の証明書が入れ替えられた、または別の PC に接続している可能性があります。"
action = "接続先で koyomi http fingerprint を実行して値を比較し、一致する場合は koyomi.toml の fingerprint を書き換えてください。"

[E2104]
when = "接続先からの応答がタイムアウトしたとき"
text = "接続先 {0} からの応答がタイムアウトしました。"
cause = "通信が遅い、または接続先のエンジンが混み合っている可能性があります。"
action = "通信の状態と接続先の負荷を確認し、再度実行してください。"

[E2105]
when = "接続先のトークンのシークレットが保存されていないとき"
text = "接続先 {0} のトークンを保存したシークレット {1} が存在しません。"
cause = "資格情報ストアに、接続先の [[remote]] の token が指すシークレットが保存されていません。"
action = "koyomi secret set {1} を実行し、接続先の [http] のトークンを保存してください。"

[E2106]
when = "接続先のトークンのシークレットを資格情報ストアから読み込めないとき"
text = "接続先 {0} のトークンのシークレット {1} を読み込めません。（{2}）"
cause = "資格情報ストアにアクセスできない、またはストアがシークレットの読み込みを拒否した可能性があります。"
action = "資格情報ストアの状態を確認し、koyomi secret set {1} でトークンを保存し直してください。"

[E2107]
when = "接続先がトークンを受け付けないとき"
text = "接続先 {0} がトークンを受け付けません。"
cause = "保存されたトークンが、接続先の [http] に登録されたトークンと一致しない可能性があります。"
action = "接続先の [http] のトークンを確認し、koyomi secret set {1} で保存し直してください。"

[E2108]
when = "画面とエンジンの通信形式のバージョンが一致しないとき"
text = "画面とエンジンのバージョンが一致しません。（画面 {0}、エンジン {1}）"
cause = "画面が送った通信形式の番号が、接続先のエンジンのものと異なります。"
action = "画面とエンジンの koyomi を同じバージョンに更新してください。"

[E2109]
when = "接続先の応答を読み込めないとき"
text = "接続先 {0} の応答を読み込めません。（{1}）"
cause = "応答が想定した形式ではありません。接続先の koyomi とバージョンが異なる、または通信が途中で途切れた可能性があります。"
action = "接続先の koyomi のバージョンを確認し、再度実行してください。"

[E2110]
when = "接続先のエンジンが画面からの操作に対応していないとき"
text = "接続先 {0} のエンジンは、この画面からの操作に対応していません。"
cause = "接続先のエンジンに /door が存在しません。古いバージョンのエンジンである可能性があります。"
action = "接続先の koyomi を新しいバージョンに更新してください。"

[E2111]
when = "接続先との TLS 接続に失敗したとき"
text = "接続先 {0} との TLS 接続に失敗しました。（{1}）"
cause = "接続先の証明書または TLS の設定に問題がある可能性があります。"
action = "接続先のエンジンの [http] の設定と、接続先のアドレスを確認してください。"

[E2112]
when = "接続先のアドレスを読み込めないとき"
text = "接続先のアドレスを読み込めません。（{0}）"
cause = "アドレスが https://ホスト[:ポート] の形式ではありません。"
action = "アドレスを https://ホスト[:ポート] の形式で指定してください。"

[E2113]
when = "接続先が想定外の応答を返したとき"
text = "接続先 {0} が想定外の応答を返しました。（{1}）"
cause = "接続先のエンジンが、エラーまたは想定外の状態を示す応答を返しました。"
action = "接続先のエンジンの状態とログを確認してください。"

[E2114]
when = "接続先のトークンでは画面を操作できないとき"
text = "接続先 {0} のトークンでは、画面を操作できません。"
cause = "トークンの利用者のロールが edit 未満である、または nets か roles で絞り込まれています。"
action = "edit 以上のロールを持ち、nets と roles で絞り込まれていない利用者のトークンを使用してください。"

[E2115]
when = "koyomi.toml に接続先が1件も登録されていないとき"
text = "接続先 {0} は、koyomi.toml に [[remote]] が存在しないため使用できません。"
cause = "koyomi.toml に [[remote]] が1件も書かれていません。"
action = "koyomi.toml に name、url、fingerprint、token を持つ [[remote]] を追加してください。"

[E2116]
when = "指定した接続先が登録されていないとき"
text = "接続先 {0} は koyomi.toml の [[remote]] に存在しません。（登録済み: {1}）"
cause = "指定した名前の [[remote]] が koyomi.toml にありません。"
action = "登録済みの接続先の名前を指定するか、[[remote]] を追加してください。"

[E2117]
when = "接続先を切り替えている最中に要求を送ろうとしたとき"
text = "接続先を切り替えている最中のため、要求を送信していません。"
cause = "画面が接続先を切り替えている間は、要求を送信しない設計になっています。"
action = "切り替えが終わってから、再度実行してください。"

[E2120]
when = "接続先のトークンを資格情報ストアに保存できないとき"
text = "接続先 {0} のトークンを資格情報ストアに保存できません。（{1}）"
cause = "資格情報ストアにアクセスできない、またはストアが書き込みを拒否した可能性があります。"
action = "資格情報ストアの状態を確認し、再度実行してください。"

[E2121]
when = "接続先の登録を koyomi.toml に書き込めないとき"
