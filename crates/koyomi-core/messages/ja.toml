[page]
title = "こんな時はどうする"
intro = "koyomi が表示するエラーと警告を、メッセージ ID ごとにまとめています。メッセージの先頭にある ID（例: KOYOMI-E2101）で検索してください。"
blanks = "「…」の部分には、接続先の名前などの具体的な内容が入ります。"
area_head = "{0}（{1}xx）"
field = "{0}: {1}"
kind = "種類"
error = "エラー"
warning = "警告"
message = "メッセージ"
cause = "原因"
action = "対処"

[E1045]
when = "サービスがインストールされていないのに、サービスを操作しようとしたとき"
text = "サービス {0} はインストールされていません。"
cause = "サービス {0} が、この PC にインストールされていません。"
action = "サービスをインストールするには、koyomi service install を実行してください。"

[E1046]
when = "すでにインストールされているサービスを、インストールしようとしたとき"
text = "サービス {0} はすでにインストールされています。"
cause = "同じ名前のサービスが、この PC にインストールされています。"
action = "インストールし直す場合は、koyomi service uninstall を実行してから、再度インストールしてください。"

[E1047]
when = "サービスのインストールで、パスワードが入力されなかったとき"
text = "パスワードが指定されていません。"
cause = "パスワードのない（PIN だけの）アカウントには、サービスをインストールできません。"
action = "パスワードを持つアカウントで、再度実行してください。"

[E1048]
when = "サインイン時に起動したエンジンが実行中に、サービスを開始しようとしたとき"
text = "サインイン時に起動したエンジンが実行中のため、サービスを開始できません。"
cause = "エンジンが 2 つ同時に実行されることはできないためです。"
action = "koyomi engine stop でエンジンを停止してから、koyomi service start を実行してください。"

[E1049]
when = "サービスを開始した直後に、サービスが停止したとき"
text = "サービス {0} は、開始後すぐに停止しました。"
cause = "サービスのエンジンが起動中にエラーで終了した可能性があります。"
action = "{1} を確認してください。"

[E1050]
when = "サービスを開始したが、エンジンが応答しないとき"
text = "サービス {0} のエンジンが、{1} 秒以内に応答しませんでした。"
cause = "サービスは開始しましたが、エンジンが接続を受け付けていません。"
action = "koyomi service status でサービスの状態を確認してください。"

[E1051]
when = "サービスとして起動されていないのに、koyomi service run を実行したとき"
text = "koyomi service run は、Windows のサービスとして起動された場合にだけ実行できます。"
cause = "このコマンドは、Windows のサービス管理から実行するためのものです。"
action = "手動でエンジンを実行する場合は、koyomi engine を実行してください。"

[E1052]
when = "Windows 以外で、サービスを操作しようとしたとき"
text = "サービスは Windows でだけ使用できます。"
cause = "この PC の OS では、koyomi service は使用できません。"
action = "Windows の PC で実行してください。"

[E1053]
when = "管理者の権限なしで、サービスを操作しようとしたとき"
text = "管理者の権限が必要です。"
cause = "サービスの操作には、管理者の権限が必要です。"
action = "「管理者として実行」で開いたターミナルで、再度実行してください。"

[E1054]
when = "サービスの名前が、サービス名として使用できないとき"
text = "サービスの名前 {0} は使用できません。"
cause = "ユーザー名からつくられた名前が、サービス名として使用できない可能性があります。"
action = "サービス名として使用できる文字のユーザー名で、再度実行してください。"

[E1055]
when = "サービスを実行するアカウントを使用できないとき"
text = "アカウント {0} が存在しないか、パスワードが指定されていません。"
cause = "アカウントが存在しないか、パスワードのない（PIN だけの）アカウントです。"
action = "パスワードを持つアカウントで、再度実行してください。"

[E1056]
when = "サービスがサインインできなかったとき"
text = "サービスがサインインできませんでした。"
cause = "インストール時に入力したパスワードが、正しくありません。"
action = "パスワードを確認してください。パスワードを変更した場合は、koyomi service uninstall を実行してから、インストールし直してください。"

[E1057]
when = "サービスの状態が、時間内に切り替わらなかったとき"
text = "サービスの状態が、時間内に切り替わりませんでした。"
cause = "サービスの開始または停止が、完了しませんでした。"
action = "koyomi service status でサービスの状態を確認してください。"

[E1058]
when = "パスワードを入力できない状態で、サービスをインストールしようとしたとき"
text = "パスワードを入力できません。"
cause = "パスワードを入力するための画面がありません。"
action = "ターミナルから koyomi.com service install を実行するか、パスワードをパイプで渡してください。"

[E1059]
when = "Windows がサービスの操作を拒否したとき"
text = "Windows がサービスの操作を拒否しました。（エラー {0}）"
cause = "Windows のサービス管理が、エラー {0} を返しました。"
action = "エラー番号を手がかりに、サービスの状態と権限を確認してください。"

[E1060]
when = "Temp フォルダーにある実行ファイルを、サービスまたはサインイン時の起動に指定しようとしたとき"
text = "{0} は Temp フォルダーにあるため、サービスまたはサインイン時の起動に指定できません。"
cause = "Temp フォルダーのファイルは、クリーンアップで削除されます。"
action = "~\\.cargo\\bin または Program Files に配置し、そこから実行してください。試験の場合は、環境変数 KOYOMI_ALLOW_TEMP=1 を設定すると指定できます。"

[E1061]
when = "エンジンを起動したが、応答しないとき"
text = "エンジンが起動しませんでした。"
cause = "エンジンを起動しましたが、接続を受け付ける状態になりませんでした。"
action = "koyomi engine を実行して、表示された内容を確認してください。"

[E1062]
when = "サービスのエンジンが停止しているとき（Windows）"
text = "サービスのエンジンが停止しています。"
cause = "サービスがインストールされており、停止しています。別のエンジンを同時に起動することはできません。"
action = "koyomi service start を実行して、サービスを開始してください。"

[E1063]
when = "サービスのエンジンが停止しているとき（Linux）"
text = "サービスのエンジンが停止しています。"
cause = "サービスがインストールされており、停止しています。別のエンジンを同時に起動することはできません。"
action = "sudo systemctl start koyomi を実行して、サービスを開始してください。"

[E1064]
when = "サービスの状態を読み取れないとき"
text = "サービスの状態を読み取れないため、エンジンを起動しません。（{0}）"
cause = "サービスがインストールされている場合、別のエンジンを起動すると、サービスのエンジンと衝突します。"
action = "サービスの状態を確認してから、再度実行してください。"

[E1065]
when = "エンジンのプロセスを起動できないとき"
text = "エンジンを起動できません。（{0}）"
cause = "エンジンのプロセスを作成できませんでした。"
action = "koyomi engine を実行して、直接起動できるかを確認してください。"

[E1066]
when = "--keys で、環境変数 KOYOMI_ADDRESS が指定されていないとき"
text = "KOYOMI_ADDRESS が指定されていません。"
cause = "--keys の画面は、実際のエンジンに接続します。実行のたびに別の名前を渡さないと、実際のエンジンのジョブまで実行されます。"
action = "実行ごとに異なる値を環境変数 KOYOMI_ADDRESS に指定してから、再度実行してください。"

[E1067]
when = "エンジンが起動していないとき"
text = "エンジンが起動していません。"
cause = "エンジンの接続口に接続できませんでした。"
action = "koyomi engine を実行するか、画面を開いてエンジンを起動してください。"

[W1068]
when = "ジョブネットが指定した通知先が、koyomi.toml の [notify] に存在しないとき"
text = "ジョブネットが指定した通知先 {0} が、koyomi.toml の [notify] に存在しません。"
cause = "存在しない名前の通知先には、webhook もメールも送信されません。"
action = "[notify] に通知先を追加するか、ジョブネットの通知先の名前を修正してください。"

[W1069]
when = "ジョブネットが使用する変数の値が、koyomi.toml の [vars] に存在しないとき"
text = "変数 {0} の値が、koyomi.toml の [vars] に存在しません。この変数を使用するジョブは、実行時にエラーになります。"
cause = "ジョブネットが変数 {0} を使用していますが、[vars] に {0} が指定されていません。"
action = "koyomi.toml の [vars] に {0} を追加するか、ジョブネットの変数の名前を修正してください。"

[W1070]
when = "グループの PC に、ホスト鍵または証明書が指定されておらず、ジョブにも指定されていないとき"
text = "グループ {0} の PC {1} に {2} が指定されておらず、ジョブにも指定されていません。このジョブは、実行時にエラーになります。"
cause = "グループの PC に {2} がなく、ジョブにも {2} がないと、接続先を確認できません。"
action = "koyomi.toml の [groups] でこの PC に {2} を指定するか、ジョブに {2} を指定してください。"

[E1071]
when = "[[http.user]] の token の sha256: が正しくないとき"
text = "[[http.user]] {0} の token の sha256: が正しくありません。"
cause = "sha256: の後ろが、小文字の 16 進数 64 文字のハッシュではないか、空のトークンのハッシュであるためです。"
action = "koyomi user reset <名前> で新しいトークンを作るか、sha256: の後ろを、小文字の 16 進数 64 文字の SHA-256 にしてください。"

[E1072]
when = "[[http.user]] の token が secret:<名前> でも sha256:<ハッシュ> でもないとき"
text = "{0} の token が、secret:<名前> または sha256:<ハッシュ> の形式で指定されていません。"
cause = "token が secret:<名前> または sha256:<ハッシュ> の形式でないためです。"
action = "token には secret:<名前> を指定し、値は koyomi secret set <名前> で OS の資格情報に保存してください。sha256:<ハッシュ> も指定できます。koyomi user add は、この形式で書きます。"

[E2101]
when = "接続先のエンジンに接続できないとき"
text = "接続先 {0} に接続できません。（{1}）"
cause = "接続先のエンジンが停止している、HTTP を受け付ける設定になっていない、またはファイアウォールで通信が遮断されている可能性があります。"
action = "接続先のエンジンが起動していること、[http] の lan = true、ファイアウォールの設定を確認してください。"

[E2102]
when = "要求が届いたかどうかを確認できないとき"
text = "要求が接続先に届いたかどうかを確認できません。（{0}）"
cause = "要求の送信後に通信が切断された、または応答の内容を確認できなかったため、接続先で処理された可能性があります。"
action = "履歴を確認し、必要な場合は再度実行してください。"

[E2103]
when = "接続先の証明書が登録された fingerprint と一致しないとき"
text = "接続先 {0} の証明書が登録された fingerprint と一致しません。（接続先が示した値: {1}）"
cause = "接続先の証明書が入れ替えられた、または別の PC に接続している可能性があります。"
action = "接続先で koyomi http fingerprint を実行して値を比較し、一致する場合は koyomi.toml の fingerprint を書き換えてください。"

[E2104]
when = "接続先からの応答がタイムアウトしたとき"
text = "接続先 {0} からの応答がタイムアウトしました。"
cause = "通信が遅い、または接続先のエンジンが混み合っている可能性があります。"
action = "通信の状態と接続先の負荷を確認し、再度実行してください。"

[E2105]
when = "接続先のトークンのシークレットが保存されていないとき"
text = "接続先 {0} のトークンを保存したシークレット {1} が存在しません。"
cause = "資格情報ストアに、接続先の [[remote]] の token が指すシークレットが保存されていません。"
action = "koyomi secret set {1} を実行し、接続先の [http] のトークンを保存してください。"

[E2106]
when = "接続先のトークンのシークレットを資格情報ストアから読み込めないとき"
text = "接続先 {0} のトークンのシークレット {1} を読み込めません。（{2}）"
cause = "資格情報ストアにアクセスできない、またはストアがシークレットの読み込みを拒否した可能性があります。"
action = "資格情報ストアの状態を確認し、koyomi secret set {1} でトークンを保存し直してください。"

[E2107]
when = "接続先がトークンを受け付けないとき"
text = "接続先 {0} がトークンを受け付けません。"
cause = "保存されたトークンが、接続先の [http] に登録されたトークンと一致しない可能性があります。"
action = "接続先の [http] のトークンを確認し、koyomi secret set {1} で保存し直してください。"

[E2108]
when = "画面とエンジンの通信形式のバージョンが一致しないとき"
text = "画面とエンジンのバージョンが一致しません。（画面 {0}、エンジン {1}）"
cause = "画面が送った通信形式の番号が、接続先のエンジンのものと異なります。"
action = "画面とエンジンの koyomi を同じバージョンに更新してください。"

[E2109]
when = "接続先の応答を読み込めないとき"
text = "接続先 {0} の応答を読み込めません。（{1}）"
cause = "応答が想定した形式ではありません。接続先の koyomi とバージョンが異なる、または通信が途中で途切れた可能性があります。"
action = "接続先の koyomi のバージョンを確認し、再度実行してください。"

[E2110]
when = "接続先のエンジンが画面からの操作に対応していないとき"
text = "接続先 {0} のエンジンは、この画面からの操作に対応していません。"
cause = "接続先のエンジンに /door が存在しません。古いバージョンのエンジンである可能性があります。"
action = "接続先の koyomi を新しいバージョンに更新してください。"

[E2111]
when = "接続先との TLS 接続に失敗したとき"
text = "接続先 {0} との TLS 接続に失敗しました。（{1}）"
cause = "接続先の証明書または TLS の設定に問題がある可能性があります。"
action = "接続先のエンジンの [http] の設定と、接続先のアドレスを確認してください。"

[E2112]
when = "接続先のアドレスを読み込めないとき"
text = "接続先のアドレスを読み込めません。（{0}）"
cause = "アドレスが https://ホスト[:ポート] の形式ではありません。"
action = "アドレスを https://ホスト[:ポート] の形式で指定してください。"

[E2113]
when = "接続先が想定外の応答を返したとき"
text = "接続先 {0} が想定外の応答を返しました。（{1}）"
cause = "接続先のエンジンが、エラーまたは想定外の状態を示す応答を返しました。"
action = "接続先のエンジンの状態とログを確認してください。"

[E2114]
when = "接続先のトークンでは画面を操作できないとき"
text = "接続先 {0} のトークンでは、画面を操作できません。"
cause = "トークンの利用者のロールが edit 未満である、または nets か roles で絞り込まれています。"
action = "edit 以上のロールを持ち、nets と roles で絞り込まれていない利用者のトークンを使用してください。"

[E2115]
when = "koyomi.toml に接続先が1件も登録されていないとき"
text = "接続先 {0} は、koyomi.toml に [[remote]] が存在しないため使用できません。"
cause = "koyomi.toml に [[remote]] が1件も書かれていません。"
action = "koyomi.toml に name、url、fingerprint、token を持つ [[remote]] を追加してください。"

[E2116]
when = "指定した接続先が登録されていないとき"
text = "接続先 {0} は koyomi.toml の [[remote]] に存在しません。（登録済み: {1}）"
cause = "指定した名前の [[remote]] が koyomi.toml にありません。"
action = "登録済みの接続先の名前を指定するか、[[remote]] を追加してください。"

[E2117]
when = "接続先を切り替えている最中に要求を送ろうとしたとき"
text = "接続先を切り替えている最中のため、要求を送信していません。"
cause = "画面が接続先を切り替えている間は、要求を送信しない設計になっています。"
action = "切り替えが終わってから、再度実行してください。"

[E2120]
when = "接続先のトークンを資格情報ストアに保存できないとき"
text = "接続先 {0} のトークンを資格情報ストアに保存できません。（{1}）"
cause = "資格情報ストアにアクセスできない、またはストアが書き込みを拒否した可能性があります。"
action = "資格情報ストアの状態を確認し、再度実行してください。"

[E2121]
when = "接続先の登録を koyomi.toml に書き込めないとき"
text = "接続先 {0} を koyomi.toml に書き込めません。（{1}）"
cause = "koyomi.toml への書き込み権限がない、またはディスクの状態に問題がある可能性があります。保存したトークンは資格情報ストアから削除済みです。"
action = "koyomi.toml の場所と書き込み権限を確認し、再度実行してください。"

[E2122]
when = "接続先の登録を koyomi.toml に書き込めず、保存したトークンも削除できないとき"
text = "接続先 {0} を koyomi.toml に書き込めません。（{1}）資格情報ストアのトークンも削除できませんでした。（{2}）"
cause = "koyomi.toml への書き込みに失敗し、その後の資格情報ストアからのトークンの削除にも失敗しました。"
action = "koyomi.toml の書き込み権限を確認し、不要なトークンは koyomi secret delete で削除してください。"

[E2123]
when = "接続中の接続先を変更しようとしたとき"
text = "接続先 {0} は接続中のため、変更できません。"
cause = "画面が現在この接続先に接続しています。"
action = "別の接続先に切り替えてから、再度実行してください。"

[E2124]
when = "接続先の URL を変更できなかったとき"
text = "接続先 {0} の URL は変更されていません。（{1}）"
cause = "新しい URL の確認に失敗したか、koyomi.toml を書き換えられませんでした。"
action = "理由を確認して、URL を入力し直してください。"

[E2125]
when = "URL の確認中に接続先が koyomi.toml で書き換えられたとき"
text = "接続先 {0} が、新しい URL の確認中に koyomi.toml で変更されました。もう一度やり直してください。"
cause = "確認に使ったトークンの指定または指紋が、書き込む前に変わっていました。"
action = "もう一度 URL を変更してください。"

[E2130]
when = "接続先の名前が入力されていないとき"
text = "接続先の名前が入力されていません。"
cause = "名前の欄が空です。"
action = "接続先の名前を入力してください。"

[E2131]
