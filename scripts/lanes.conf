# koyomi's values for the lanes' shared scripts (scripts/lanes.sh): the
# scripts are the same bytes in every uchmk app and read what differs from
# here. kura's scripts/lanes.conf says what each key is for.
app=koyomi
crate=koyomi
bin=koyomi
keys_env=KOYOMI_KEYS_DONE
state=koyomi-wintest
isolate=KOYOMI_CONFIG_HOME KOYOMI_STATE_HOME UCHMK_CONFIG_DIR
evidence=C:\dev\koyomi-evidence
todo_marks=【人】 【金】 【実機】 要確認
# koyomi takes the ito-first check and its lists, not the test lanes' scripts
# (add the names when the app gets those lanes).
files=lanes.sh ito-first.py ito-first.txt ito-required.txt release-sums.sh keys.ps1 evidence.py visual-check.py make-canary.py
# The workflows written from ito's templates by lanes.sh sync (audit.yml and ci.yml are the app's own).
workflows=build.yml arm64.yml checklists.yml release.yml release-sums.yml
# koyomi ships its own Debian files (scripts/package-linux.sh); the plain Linux tarballs are not made.
release_linux=no
